name: Feature Request 💡
description: Request a feature for ModuleForge.
labels: [enhancement]
body:

# Feature Request Section
  - type: textarea
    id: feature-description
    attributes:
      label: Brief description of your Feature Request 💡
      description: What would you like to see?

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Use Case
      description: Why does this feature matter? How would it improve workflows?

  - type: checkboxes
    id: roadmap-check
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have checked the [Roadmap](https://github.com/adrian-andersson/ModuleForge/blob/main/Roadmap.md) to confirm this isn't already planned
