name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type of version increment'
        required: true
        default: 'none'
        type: choice
        options:
          - major
          - minor
          - patch
          - none
      release_type:
        description: 'Type of release'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - stable
          - prerelease
      dependency_source:
        description: 'Where to install ModuleForge and other build modules from. required-resource-file uses the versions pinned in BuildDependencies.psd1'
        required: false
        default: 'required-resource-file'
        type: choice
        options:
          - required-resource-file
          - psgallery-latest
          - psgallery-prerelease
      include_source_metadata:
        description: 'Add the branch and commit this was built from to the package metadata'
        required: false
        default: true
        type: boolean


jobs:
  buildAndRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write #required for pushing tags and creating releases
      packages: write #Needed for publishing to Github packages
      actions: read #Grant read access to actions and logs

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 #Ensure we are getting all the tag history
          persist-credentials: false #The build runs repository code, so keep the token off disk. Only the tag step gets it

      - name: Git Check
        shell: pwsh
        run: |
          $VerbosePreference = 'Continue'
          $gitVer = git --version
          $gitFolder = git rev-parse --is-inside-work-tree
          write-verbose "GitVersion: $gitVer"
          write-verbose "IsGitWorkingDirectory: $gitFolder"

      - name: Check Pester Test Workflow status
        shell: pwsh
        env:
          REPO_URI: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VerbosePreference = 'Continue'
          $workflow = 'pesterTest.yml'
          $Owner = "$env:GITHUB_REPOSITORY_OWNER"
          $Repo = "$env:GITHUB_REPOSITORY"
          write-verbose "Owner: $owner"
          write-verbose "Repo: $repo"
          $repositoryUri = "https://github.com/$($env:REPO_URI)"
          $apiUri = "https://api.github.com/repos/$Repo/actions/workflows/$Workflow/runs?per_page=2&status=completed"
          write-verbose "apiUri: $apiUri"
          $token = $env:GITHUB_TOKEN
          $headers = @{
            Authorization = "token $token"
            Accept = 'application/vnd.github.v3+json'
          }
          $WorkflowRuns = Invoke-RestMethod -Uri $apiUri -Headers $Headers -ve
          $LatestRun = $WorkflowRuns.workflow_runs | Select-Object -First 1
          if(!$latestRun){throw "❌ No $($workflow) workflows found"}
          write-verbose "LatestPesterRun Status: $($LatestRun.conclusion) LatestRun SHA: $($LatestRun.head_sha)"
          if($latestRun.conclusion -ne 'success'){
            throw "❌ The most recent Pester Test failed. Fix the issues before proceeding."
          }
          $LatestTestSHA = $LatestRun.head_sha
          $gitLog = git log --pretty=format:"%H - %s" -n 2
          #write-verbose "Git Log:`n$($gitLog|out-string)"
          $split = $gitLog[0].split(' - ')
          $lastSha = $split[0]
          $message = $split[1]
          write-verbose "Last Commit SHA: $lastSha"
          if($lastSha -eq $LatestTestSHA)
          {
            write-host '✅ Pester Test validation passed! Matched last commit'
          }elseIf($message -like 'Merge pull request*'){
            write-verbose 'Last commit was a merge. Checking previous commit'
            $split2 = $gitLog[1].split(' - ')
            $prSha = $split2[0]
            $prMessage = $split2[1]
            write-verbose "Last PR SHA: $prSha"
            if($prSha -eq $LatestTestSHA)
            {
              write-host '✅ Pester Test validation passed! Matched PR Test Commit'
            }else{
              throw "❌ The most recent Pester Test failed. Fix the issues before proceeding."
            }
          }else{
            throw "❌ No match on PR or primary commit with last Pester Test. Please check pester and try again!"
          }

      - name: Install dependencies #Install the modules we need for the build, from BuildDependencies.psd1 unless asked otherwise
        shell: pwsh
        env:
          DEPENDENCY_SOURCE: ${{ github.event.inputs.dependency_source }}
        run: |
          $VerbosePreference = 'Continue'
          $source = switch($env:DEPENDENCY_SOURCE)
          {
            'psgallery-latest' { 'PSGallery' }
            'psgallery-prerelease' { write-verbose '********WARNING: Will use the latest ModuleForge, even if it is a prerelease ********'; 'PSGalleryPrerelease' }
            default { 'RequiredResourceFile' }
          }
          $installed = ./source/resource/scripts/Install-MFBuildDependencies.ps1 -Source $source -Name ModuleForge
          $installed|Format-Table
          #Each step is a new session, so later steps import this exact version, in case a persistent runner has others
          $moduleForgeVersion = $installed.Version -replace '-.*$',''
          "MODULEFORGE_VERSION=$moduleForgeVersion" >> $env:GITHUB_ENV
          import-module Microsoft.PowerShell.PSResourceGet
          import-module ModuleForge -RequiredVersion $moduleForgeVersion
          $moduleList = @('Microsoft.PowerShell.PSResourceGet','ModuleForge')
          get-module $moduleList|Select-object Name,@{name='version';expression={if($_.PrivateData.PSData.Prerelease){"$($_.Version)-$($_.PrivateData.PSData.Prerelease)"}else{"$($_.Version)"}}}|Format-Table

      - name: Get next version and build #Execute the moduleForge command to create new module files
        shell: pwsh
        id: generate_tag
        if: success()
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $VerbosePreference = 'Continue'
          import-module ModuleForge -RequiredVersion $env:MODULEFORGE_VERSION
          #A rerun of a run that already tagged this commit should finish that version, not make another.
          #Drop the local tag so the version and changelog are worked out as they were. The tag step puts it back
          $existingTag = if([int]$env:RUN_ATTEMPT -gt 1){ git tag --points-at HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+' } | Select-Object -First 1 }
          if($existingTag)
          {
            write-verbose "Rerun of a run that tagged this commit as $existingTag. Finishing that version"
            git tag -d $existingTag
            $nextVersion = [semver]$existingTag.TrimStart('v')
          }else{
            $latest = get-mfGitLatestVersion
            #Inputs to determine next semver
            $versionType = $env:VERSION_TYPE
            write-verbose "Version Increment Type: $versionType"
            $releaseType = $env:RELEASE_TYPE
            write-verbose "Version Release Type: $releaseType"
            $nextVerSplat = @{
              version = $latest #The current version
            }
            if($versionType -eq 'none'){
              write-verbose 'Bumping current version'
            }else{
              write-verbose "Changing $versionType version"
              $nextVerSplat.increment = $versionType
            }
            if($releaseType -eq 'prerelease'){
              write-verbose 'Adding PreRelease Tag'
              $nextVerSplat.prerelease = $true
            }else{
              write-verbose 'Stable Release'
              $nextVerSplat.stablerelease = $true
            }
            $nextVersion = get-mfNextSemver @nextVerSplat
          }
          Write-Verbose "NEXT VERSION SHOULD BE: $nextVersion"
          write-verbose 'Compiling Changelog'
          $changeLog = get-mfGitChangeLog -fromLastTag
          Build-mfProject -version $nextVersion -InformationAction Continue -releaseNotes $changeLog
          write-verbose "Push $nextVersion to workflow as EnvVar"
          write-output "next_version=$nextVersion" >> $env:GITHUB_OUTPUT
          write-verbose "Push changeLog to workflow as EnvVar"
          #Need to do this as a special multiline value so it works correctly
          "change_log<<EOF" >> $env:GITHUB_OUTPUT
          $changeLog >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Publish to Local #Push the build from last step to a temporary file-based repository on the build machine. Add Repository to XML for GHPackages Compatibility
        shell: pwsh
        id: publish_local
        if: success()
        env:
          REPO_URI: ${{ github.repository }}
          INCLUDE_SOURCE_METADATA: ${{ github.event.inputs.include_source_metadata }}
        run: |
          $VerbosePreference = 'continue'
          import-module ModuleForge -RequiredVersion $env:MODULEFORGE_VERSION
          $repositoryUri = "https://github.com/$($env:REPO_URI)"
          write-verbose "Repository URI: $repositoryUri"
          $currentPath = get-location
          #Find the item from the build
          #Find the manifest by name, as the module's resource folder can ship other .psd1 files
          $moduleName = (Import-Clixml moduleForgeConfig.xml).moduleName
          $psd1Ref = (Get-Item -Path (Join-Path -Path . -ChildPath "build/$moduleName/$moduleName.psd1") -ErrorAction SilentlyContinue).FullName
          if($psd1Ref)
          {
            write-verbose "Found PSD1 file: $psd1Ref"
          }else{
            throw 'No PSD1 file found'
          }

          $repositoryPath = join-path -path $currentPath -childPath 'LocalRepository'
          write-verbose "Will create local repository at path: $repositoryPath"
          if(!(test-path $repositoryPath))
          {
            new-item -itemType Directory -path $repositoryPath
          }
          register-mfLocalPsResourceRepository -path $repositoryPath
          publish-psresource -repository LocalTestRepository -path $psd1Ref

          $nuRef = (get-childItem -path $repositoryPath -recurse -filter *.nupkg).fullname
          if($nuRef)
          {
            write-verbose "Found NUPKG: $nuRef"
          }else{
            throw 'No NUPKG found'
          }
          $repositoryXmlSplat = @{
            repositoryUri = $repositoryUri
            nugetPackagePath = $nuRef
          }
          if($env:INCLUDE_SOURCE_METADATA -ne 'false')
          {
            write-verbose "Adding source metadata: branch $($env:GITHUB_REF_NAME), commit $($env:GITHUB_SHA)"
            $repositoryXmlSplat.Branch = $env:GITHUB_REF_NAME
            $repositoryXmlSplat.Commit = $env:GITHUB_SHA
          }
          add-mfRepositoryXmlData @repositoryXmlSplat

      - name: Build summary #Version, size and hashes on the run's summary page
        shell: pwsh
        if: success()
        run: |
          import-module ModuleForge -RequiredVersion $env:MODULEFORGE_VERSION
          if(get-command Get-MFBuildSummary -ErrorAction SilentlyContinue)
          {
            $nuRef = (get-childItem -path (join-path -path (get-location) -childPath 'LocalRepository') -recurse -filter *.nupkg).fullname
            (Get-MFBuildSummary -NugetPackagePath $nuRef).Markdown >> $env:GITHUB_STEP_SUMMARY
          }else{
            write-warning 'This ModuleForge version has no Get-MFBuildSummary, so there is no build summary'
          }

      - name: Create new tag #Create version tag
        shell: pwsh
        if: success()
        env:
          NEXT_VERSION: ${{ steps.generate_tag.outputs.next_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VerbosePreference = 'Continue'
          write-verbose 'Post VerbosePreference'
          Write-Verbose "Creating tag v$($env:NEXT_VERSION)"
          $ver = "v$($env:NEXT_VERSION)"

          if($ver -and $ver -ne 'v' -and $ver.length -ge 6)
          {
            write-verbose "Tagging Version as: $ver"
            git tag "$ver"
            #Checkout did not keep the token, so hand it to this push only, through env rather than the command line
            $basicAuth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$($env:GITHUB_TOKEN)"))
            write-output "::add-mask::$basicAuth"
            $env:GIT_CONFIG_COUNT = '1'
            $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
            $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basicAuth"
            #On a rerun the tag is already on the remote, on this same commit, so this push changes nothing
            git push origin "refs/tags/$ver"
            if($LASTEXITCODE -ne 0){throw "Unable to push tag $ver"}
          }else{
            throw 'No Version Tag found'
          }

      - name: Create GitHub Release #Push the nupkg and tag as a release
        shell: pwsh
        if: success()
        env:
          NEXT_VERSION: ${{ steps.generate_tag.outputs.next_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGE_LOG: ${{ steps.generate_tag.outputs.change_log }}
        run: |
          $VerbosePreference = 'Continue'
          $ver = "v$($env:NEXT_VERSION)"
          #A rerun keeps the release an earlier attempt made, rather than replace its package
          $null = gh release view $ver 2>&1
          if($LASTEXITCODE -eq 0)
          {
            write-warning "Release $ver already exists, so it is left as it is"
            exit 0
          }
          $releaseName = "Release $($ver)"
          #Reuse changelog from buildAndRelease step
          $markdownText = $($env:CHANGE_LOG)
          if(!$markdownText){
            $markdownText = "#Release Version: $ver`n_no changelog provided_`n"
          }
          #Get the NuPkg file to send with the release
          $currentPath = get-location
          $repositoryPath = join-path -path $currentPath -childPath 'LocalRepository'
          $nuRef = (get-childItem -path $repositoryPath -recurse -filter *.nupkg).fullname
          if($nuRef)
          {
            write-verbose "Found NUPKG: $nuRef"
          }else{
            throw 'No NUPKG found'
          }
          write-verbose 'Adding Module and Manifest SHAs to Release Notes for verification'
          # Load module name from ModuleForge config
          $moduleName = (Import-Clixml moduleForgeConfig.xml).moduleName
          # Locate the manifest and module script
          $psd1Ref = Get-ChildItem -Path build -Filter "$moduleName.psd1" -Recurse | Select-Object -First 1
          $psm1Ref = Get-ChildItem -Path build -Filter "$moduleName.psm1" -Recurse | Select-Object -First 1
          # Compute SHA256 hashes
          $psd1Sha = (Get-FileHash -Path $psd1Ref.FullName -Algorithm SHA256).Hash.ToLower()
          $psm1Sha = (Get-FileHash -Path $psm1Ref.FullName -Algorithm SHA256).Hash.ToLower()
          # Append to markdown
          $markDownText = "$($markDownText)`n### 🔐 SHA256 Checksums`n$("$moduleName").psd1: $psd1Sha `n$("$moduleName").psm1: $psm1Sha"
          # Flag prerelease tags (SemVer prerelease label, e.g. v1.3.0-prev009) so GitHub does not
          # badge them as "Latest"; stable releases are marked latest explicitly.
          if($ver -like '*-*')
          {
            gh release create $ver --title $releaseName --notes $markDownText --prerelease
          }else{
            gh release create $ver --title $releaseName --notes $markDownText --latest
          }
          gh release upload $ver $nuRef

      - name: Publish to GitHub Packages #Publish module to GH Packages
        shell: pwsh
        if: success()
        env:
          NEXT_VERSION: ${{ steps.generate_tag.outputs.next_version }}
          REPO_URI: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VerbosePreference = 'Continue'
          $ver = "v$($env:NEXT_VERSION)"
          $repoUri = "https://nuget.pkg.github.com/$($env:REPO_URI)/index.json"
          $currentPath = get-location
          $repositoryPath = join-path -path $currentPath -childPath 'LocalRepository'
          $nuRef = (get-childItem -path $repositoryPath -recurse -filter *.nupkg).fullname
          if($nuRef)
          {
            write-verbose "Found NUPKG: $nuRef"
          }else{
            throw 'No NUPKG found'
          }
          #A rerun keeps the package an earlier attempt published
          dotnet nuget push $nuRef -k $env:GITHUB_TOKEN -s $repoUri --skip-duplicate

      - name: Trigger ModuleForge.Test.Private #Build the test module with this exact version, then buildTest it
        shell: pwsh
        if: success()
        env:
          NEXT_VERSION: ${{ steps.generate_tag.outputs.next_version }}
          #Fine-grained PAT, Contents: read and write on ModuleForge.Test.Private only (repository_dispatch needs it)
          DISPATCH_TOKEN: ${{ secrets.TEST_PRIVATE_DISPATCH_TOKEN }}
        run: |
          $VerbosePreference = 'Continue'
          if(!$env:DISPATCH_TOKEN)
          {
            write-warning 'No TEST_PRIVATE_DISPATCH_TOKEN secret, so ModuleForge.Test.Private is not triggered'
            exit 0
          }
          $target = "$($env:GITHUB_REPOSITORY_OWNER)/ModuleForge.Test.Private"
          write-verbose "Sending moduleforge-build for $($env:NEXT_VERSION) to $target"
          $body = @{
            event_type = 'moduleforge-build'
            client_payload = @{ version = $env:NEXT_VERSION; commit = $env:GITHUB_SHA }
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $($env:DISPATCH_TOKEN)"
            Accept = 'application/vnd.github+json'
          }
          #A failed trigger should not fail a release that is already published
          try{
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$target/dispatches" -Headers $headers -Body $body -ContentType 'application/json'
            write-host "✅ Triggered Build and Release in $target"
          }catch{
            write-warning "Unable to trigger $($target): $_"
          }