name: Execute Pester Testing

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:


jobs:
  pesterTest:
    runs-on: ubuntu-latest
    permissions:
      contents: read #PR code runs in this job, so it gets nothing else. The pesterComment job posts the PR comment
    outputs:
      coverage: ${{ steps.pester_tests.outputs.coverage }}
      coverageTarget: ${{ steps.pester_tests.outputs.coverageTarget }}
      result: ${{ steps.pester_tests.outputs.result }}
      passedCount: ${{ steps.pester_tests.outputs.passedCount }}
      failedCount: ${{ steps.pester_tests.outputs.failedCount }}
      skippedCount: ${{ steps.pester_tests.outputs.skippedCount }}
      duration: ${{ steps.pester_tests.outputs.duration }}
      pesterVersion: ${{ steps.pester_tests.outputs.pesterVersion }}


    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: pwsh
        run: |
          #What testDependencies in moduleForgeConfig.xml asks for: None, PesterAndScriptAnalyzer (the default) or All. Never ModuleForge
          ./scripts/Install-MFBuildDependencies.ps1 -ForTests | Format-Table
          $moduleList = @('Pester')
          import-module $moduleList
          get-module $moduleList|Select-object Name,@{name='version';expression={if($_.PrivateData.PSData.Prerelease){"$($_.Version)-$($_.PrivateData.PSData.Prerelease)"}else{"$($_.Version)"}}}|Format-Table

      - name: Run Pester tests
        shell: pwsh
        id: pester_tests
        run: |
          $functionsPath = $(join-path -path (join-path -path . -childpath 'source') -childpath 'functions')
          $privatePath = $(join-path -path (join-path -path . -childpath 'source') -childpath 'private')
          # Discover tests alongside functions AND private; if a root 'tests' folder exists (case-insensitive), also discover it. Coverage stays on source/functions only.
          $runPaths = @($functionsPath)
          if(test-path $privatePath){ $runPaths += $privatePath }
          $testsFolder = Get-ChildItem -LiteralPath . -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -ieq 'tests' } | Select-Object -First 1
          if($testsFolder){ $runPaths += $testsFolder.FullName }
          $pesterConfigHash = @{
              Run = @{
                  Passthru = $true
                  Path = $runPaths
              }
              CodeCoverage = @{
                  Enabled = $true
                  Path = $(if(test-path $privatePath){ @($functionsPath,$privatePath) }else{ $functionsPath })
              }
              Output = @{
                  Verbosity = 'Detailed'
              }
          }
          $pesterConfig = New-PesterConfiguration -hashtable $pesterConfigHash

          try{
            Invoke-Pester -Configuration $pesterConfig|Tee-Object -variable pesterCapture
          }catch{
            write-verbose "WARNING: Pester threw an exception: $($_.Exception.Message)"
            $pesterFailed = $true
          }

          if($pesterCapture)
          {
            # Export as job output. The pesterComment job builds the PR comment from these
            "coverage=$([math]::Round($pesterCapture.CodeCoverage.CoveragePercent, 0))" >> $env:GITHUB_OUTPUT
            "coverageTarget=$($pesterCapture.CodeCoverage.CoveragePercentTarget)" >> $env:GITHUB_OUTPUT
            "result=$($pesterCapture.Result)" >> $env:GITHUB_OUTPUT
            "passedCount=$($pesterCapture.PassedCount)" >> $env:GITHUB_OUTPUT
            "failedCount=$($pesterCapture.FailedCount)" >> $env:GITHUB_OUTPUT
            "skippedCount=$($pesterCapture.SkippedCount)" >> $env:GITHUB_OUTPUT
            "duration=$($pesterCapture.Duration.toString())" >> $env:GITHUB_OUTPUT
            "pesterVersion=$($pesterCapture.Version)" >> $env:GITHUB_OUTPUT
          }else{
            throw 'Error with Pester Invocation'
          }

          if($pesterFailed){throw 'Error with Pester invocation'}
          if($pesterCapture.Result -eq 'Failed'){throw "Pester failed: $($pesterCapture.FailedCount) test(s), $($pesterCapture.FailedContainersCount) container(s)"}

  pesterComment:
    needs: pesterTest
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pull-requests: write #Needed for adding comment. This job must never checkout or run repository code

    steps:
      - name: Build PR comment
        shell: pwsh
        env:
          #These values were written while PR code was running, so they are untrusted. Read them from env, never in script text
          COVERAGE: ${{ needs.pesterTest.outputs.coverage }}
          COVERAGE_TARGET: ${{ needs.pesterTest.outputs.coverageTarget }}
          PESTER_RESULT: ${{ needs.pesterTest.outputs.result }}
          PASSED_COUNT: ${{ needs.pesterTest.outputs.passedCount }}
          FAILED_COUNT: ${{ needs.pesterTest.outputs.failedCount }}
          SKIPPED_COUNT: ${{ needs.pesterTest.outputs.skippedCount }}
          PESTER_DURATION: ${{ needs.pesterTest.outputs.duration }}
          PESTER_VERSION: ${{ needs.pesterTest.outputs.pesterVersion }}
        run: |
          $pesterResult = $env:PESTER_RESULT
          if($pesterResult -match '^[A-Za-z]+$')
          {
            $cc = [int]$env:COVERAGE
            $ccp = [int]$env:COVERAGE_TARGET
            $passedCount = [int]$env:PASSED_COUNT
            $failedCount = [int]$env:FAILED_COUNT
            $skippedCount = [int]$env:SKIPPED_COUNT
            $duration = $(if($env:PESTER_DURATION -match '^[0-9:.]+$'){$env:PESTER_DURATION}else{'Unknown'})
            $pesterVersion = $(if($env:PESTER_VERSION -match '^[0-9A-Za-z.\-]+$'){$env:PESTER_VERSION}else{'Unknown'})
            $midpoint = $ccp + ((100 - $ccp) / 2)
            $badge = $(if($cc -lt $ccp){"🔴 Failed"}elseIf($cc -lt $midpoint){"🟡 Caution"}elseIf($cc -lt 98){"🟢 Good"}else{"🟢 Perfect 🏅"})
            $pesterMarkdown = @(
              "### 🧪 Pester Test Results"
              "**Result:** $pesterResult $(if($pesterResult -eq 'Passed'){"✅"}else{"❌"})"
              "**Tests:** 🟢 $passedCount passed | 🔴 $failedCount failed | ⚪ $skippedCount skipped"
              "**Duration:** $duration"
              "`n"
              "### 📊 Code Coverage"
              "**Coverage:**  $($cc)% $badge"
              "**Target:** $($ccp)%"
              "`n"
              "### ℹ️ Runtime Info"
              "**Pester Version:** $pesterVersion"
              "**PSVersion:** $($psversiontable.PSVersion.ToString()) $($psversiontable.PSEdition)"
              "**OS:** $($psversiontable.OS) $($psversiontable.Platform)"
              "`n"
              "_This comment was generated automatically by the CI pipeline._"
            ) -join "`n"
          }else{
            $pesterMarkdown = @(
              '### ❌ Pester Test Run Failed'
              'Pester encountered an error and could not complete the test run.'
              'Please check the logs for more details.'
              '_This comment was generated automatically by the CI pipeline._'
            ) -join "`n"
          }
          $pesterMarkdown|out-file -FilePath pesterMarkdown.md -encoding UTF8

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: pesterMarkdown.md
          header: pesterResult

  codeCoverageCheck:
      needs: pesterTest
      runs-on: ubuntu-latest
      permissions: {} #Only compares two numbers, so it needs no token access
      continue-on-error: true
      steps:
        - name: Check Coverage Threshold
          shell: pwsh
          env:
            COVERAGE: ${{ needs.pesterTest.outputs.coverage }} #PR code writes this value, so keep it out of the script text
            COVERAGE_TARGET: ${{ needs.pesterTest.outputs.coverageTarget }}
          run: |
            $coverage = [int]$env:COVERAGE
            $coverageTarget = [int]$env:COVERAGE_TARGET
            Write-Verbose "Coverage from previous job: $coverage%"

            if ($coverage -lt $coverageTarget) {
              Write-Error "Code coverage ($coverage%) is below the required threshold ($coverageTarget%)."
              exit 1
            } else {
              Write-Verbose "Coverage is acceptable."
            }

  # OPTIONAL - test on Windows and macOS as well. Remove the # from each line below to enable.
  # These runs fail the check if a test fails, but the PR comment and coverage check above
  # only report the Ubuntu run, so their results never overwrite each other.
