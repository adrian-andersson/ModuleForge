trigger: none

parameters:
  - name: version_type
    displayName: 'Type of version increment'
    type: string
    default: 'none'
    values: [major, minor, patch, none]

  - name: release_type
    displayName: 'Type of release, stable or prerelease'
    type: string
    default: 'prerelease'
    values: [stable, prerelease]

  - name: dependency_source
    displayName: 'Where to install ModuleForge and other build modules from. required-resource-file uses the versions pinned in BuildDependencies.psd1'
    type: string
    default: 'required-resource-file'
    values: [required-resource-file, psgallery-latest, psgallery-prerelease]

  - name: include_source_metadata
    displayName: 'Add the branch and commit this was built from to the package metadata'
    type: boolean
    default: true

  # This pipeline publishes PowerShell modules to an Azure Artifacts feed, named psPackages by default.
  # The feed can be scoped to this project or to the organization: the pipeline finds which before it builds.
  # Change the default if your feed has another name, and the same parameter in buildTest.yml
  - name: feed_name
    displayName: 'Azure DevOps feed'
    type: string
    default: 'psPackages'


jobs:
- job: buildAndRelease
  pool:
    name: 'Azure Pipelines'
    vmImage: 'ubuntu-latest'
  steps:
  - checkout: self
    displayName: 'Checkout repository'
    persistCredentials: false #The build runs repository code, so keep the token off disk. Only the tag step gets it
    fetchDepth: 0
    fetchTags: true #Versioning reads the tags, so do not rely on the Sync tags pipeline setting

  - pwsh: |
      $VerbosePreference = 'Continue'
      $gitVer = git --version
      $gitFolder = git rev-parse --is-inside-work-tree
      write-verbose "GitVersion: $gitVer"
      write-verbose "IsGitWorkingDirectory: $gitFolder"
      $repoName = "$(Build.Repository.Name)"
      $repoUri = "$(Build.Repository.Uri)"
      Write-Host "Repo Name: $repoName"
      Write-Host "Repo URI: $repoUri"
    displayName: 'Git Check'


  - pwsh: |
      $VerbosePreference = 'Continue'
      $source = switch('${{ parameters.dependency_source }}')
      {
        'psgallery-latest' { 'PSGallery' }
        'psgallery-prerelease' { Write-Verbose '********WARNING: Will use the latest ModuleForge, even if it is a prerelease ********'; 'PSGalleryPrerelease' }
        default { 'RequiredResourceFile' }
      }
      $installed = ./scripts/Install-MFBuildDependencies.ps1 -Source $source -Name ModuleForge
      $installed|Format-Table
      #Each step is a new session, so later steps import this exact version, in case a self-hosted agent has others
      $moduleForgeVersion = $installed.Version -replace '-.*$',''
      Write-Output "##vso[task.setvariable variable=MODULEFORGE_VERSION]$moduleForgeVersion"
      import-module Microsoft.PowerShell.PSResourceGet
      import-module ModuleForge -RequiredVersion $moduleForgeVersion
      $moduleList = @('Microsoft.PowerShell.PSResourceGet','ModuleForge')
      get-module $moduleList|Select-object Name,@{name='version';expression={if($_.PrivateData.PSData.Prerelease){"$($_.Version)-$($_.PrivateData.PSData.Prerelease)"}else{"$($_.Version)"}}}|Format-Table
    displayName: 'Install Dependencies'

  - pwsh: |
      $VerbosePreference = 'Continue'
      #Find the feed before building, so a missing feed stops the run before it tags a version
      $feedName = '${{ parameters.feed_name }}'
      $project = "$(System.TeamProject)"
      $collectionUri = "$(System.CollectionUri)".TrimEnd('/')
      $feedsBase = if($collectionUri -match '^https://dev\.azure\.com/([^/]+)$'){
        "https://feeds.dev.azure.com/$($Matches[1])"
      }elseif($collectionUri -match '^https://([^.]+)\.visualstudio\.com$'){
        "https://$($Matches[1]).feeds.visualstudio.com"
      }else{
        throw "Unable to work out the Azure Artifacts address from collection URI $collectionUri"
      }
      $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
      $feedSegment = [uri]::EscapeDataString($feedName)
      $candidates = [ordered]@{
        project = "$feedsBase/$([uri]::EscapeDataString($project))/_apis/packaging/feeds/$($feedSegment)?api-version=7.1"
        organization = "$feedsBase/_apis/packaging/feeds/$($feedSegment)?api-version=7.1"
      }
      $scope = $null
      foreach($candidate in $candidates.GetEnumerator())
      {
        try{
          $feed = Invoke-RestMethod -Uri $candidate.Value -Headers $headers -ErrorAction Stop
          if($feed.id){ $scope = $candidate.Key; break }
        }catch{
          Write-Verbose "No $($candidate.Key)-scoped feed named $($feedName): $($_.Exception.Message)"
        }
      }
      if(!$scope)
      {
        throw "❌ No feed named '$feedName' in project '$project' or in the organization. Create it in Artifacts, or set feed_name. If it exists, give '$project Build Service' the Feed Publisher (Contributor) role on it"
      }
      #The push task takes <project>/<feed> for a project-scoped feed, and just the feed for an organization-scoped one
      $publishFeed = if($scope -eq 'project'){ "$project/$feedName" }else{ $feedName }
      Write-Host "Feed '$feedName' is $scope-scoped. Publishing to: $publishFeed"
      Write-Output "##vso[task.setvariable variable=publishFeed]$publishFeed"
    displayName: 'Find the Azure Artifacts feed'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - pwsh: |
      $VerbosePreference = 'Continue'
      import-module ModuleForge -RequiredVersion $env:MODULEFORGE_VERSION
      #A rerun of a run that already tagged this commit should finish that version, not make another.
      #Drop the local tag so the version and changelog are worked out as they were. The tag step puts it back
      $existingTag = if([int]$env:SYSTEM_JOBATTEMPT -gt 1){ git tag --points-at HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+' } | Select-Object -First 1 }
      if($existingTag)
      {
        Write-Verbose "Rerun of a run that tagged this commit as $existingTag. Finishing that version"
        git tag -d $existingTag
        $nextVersion = [semver]$existingTag.TrimStart('v')
        $changeLog = get-mfGitChangeLog -fromLastTag
      }else{
      $latest = get-mfGitLatestVersion
      #Inputs to determine next semver
      $versionType = '${{ parameters.version_type }}'
      write-verbose "Version Increment Type: $versionType"
      $releaseType = '${{ parameters.release_type }}'
      Write-Verbose "Version Release Type: $releaseType"
      $nextVerSplat = @{
        version = $latest
      }
      if($versionType -eq 'none') {
        Write-Verbose 'Bumping current version'
      }else{
        Write-Verbose "Changing $versionType version"
        $nextVerSplat.increment = $versionType
      }

      if ($releaseType -eq 'prerelease') {
        Write-Verbose 'Adding PreRelease Tag'
        $nextVerSplat.prerelease = $true
      }else{
        Write-Verbose 'Stable Release'
        $nextVerSplat.stablerelease = $true
      }
      $changeLog = get-mfGitChangeLog -fromLastTag
      $nextVersion = Get-mfNextSemver @nextVerSplat
      }
      Write-Verbose "NEXT VERSION SHOULD BE: $nextVersion"
      Build-mfProject -version $nextVersion -InformationAction Continue -releaseNotes $changeLog
      Write-Verbose "Push $nextVersion to pipeline variable"
      Write-Output "##vso[task.setvariable variable=next_version]$nextVersion"
    displayName: 'Get next version and build'

  - pwsh: |
      $verbosePreference = 'continue'
      import-module ModuleForge -RequiredVersion $env:MODULEFORGE_VERSION
      write-verbose 'Step1: Getting Feed URI'
      #STEP 1 - Get all our Params in order and figure out our Repository URI to inject into the NUSPEC
      #NOTE: This is very different to Github Actions. Something like "https://dev.azure.com/$(System.TeamProject)/_git/$(Build.Repository.Name)"
      $repName = "$(Build.Repository.Name)"
      $CollectionUri = "$(System.CollectionUri)"
      $FullGitUri = "$($CollectionUri)_git/$($repName)"
      if($FullGitUri)
      {
        $uri = [uri]::new($FullGitUri)
        $escapedUri = $($uri.AbsoluteUri)
        write-verbose "FullUriEscaped: $escapedUri"
      }else{
        throw 'Something went wrong with parsing the Feed URI'
      }
      write-verbose 'Step2: Creating Local Repo'
      $currentPath = get-location
      #Find the item from the build
      #Find the manifest by name, as the module's resource folder can ship other .psd1 files
      $moduleName = (Import-Clixml moduleForgeConfig.xml).moduleName
      $psd1Ref = (Get-Item -Path (Join-Path -Path . -ChildPath "build/$moduleName/$moduleName.psd1") -ErrorAction SilentlyContinue).FullName
      if($psd1Ref)
      {
        write-verbose "Found PSD1 file: $psd1Ref"
      }else{
        throw 'No PSD1 file found, nothing to publish to local'
      }
      $repositoryPath = join-path -path $currentPath -childPath 'LocalRepository'
      write-verbose "Will create local repository at path: $repositoryPath"
      if(!(test-path $repositoryPath))
      {
        new-item -itemType Directory -path $repositoryPath
      }else{
        #In case runner is not clean, scrub and remove
        if((get-psResourceRepository 'LocalTestRepository' -erroraction ignore))
        {
          write-verbose 'Cleaning up existing Repository Registration'
          unregister-psresourceRepository 'LocalTestRepository'
        }else{
          write-verbose 'Repository not found to be removed'
        }
        write-verbose 'Removing directory and recreating'
        remove-item $repositoryPath -force -recurse
        new-item -itemType Directory -path $repositoryPath
      }
      write-verbose 'Registering local repository'
      register-mfLocalPsResourceRepository -path $repositoryPath
      write-verbose 'Step3: Publish module to Local Repository'
      publish-psresource -repository LocalTestRepository -path $psd1Ref
      $nuRef = (get-childItem -path $repositoryPath -recurse -filter *.nupkg).fullname
      if($nuRef)
      {
        write-verbose "Found NUPKG: $nuRef"
      }else{
        throw 'No NUPKG found'
      }
      write-verbose 'Step4: Add Repository URI to NuSpec'
      $repositoryXmlSplat = @{
        repositoryUri = $escapedUri
        nugetPackagePath = $nuRef
        force = $true
      }
      if('${{ parameters.include_source_metadata }}' -eq 'True')
      {
        write-verbose "Adding source metadata: branch $($env:BUILD_SOURCEBRANCHNAME), commit $($env:BUILD_SOURCEVERSION)"
        $repositoryXmlSplat.Branch = $env:BUILD_SOURCEBRANCHNAME
        $repositoryXmlSplat.Commit = $env:BUILD_SOURCEVERSION
      }
      add-mfRepositoryXmlData @repositoryXmlSplat
      Write-Output "##vso[task.setvariable variable=nuget_Package_Path]$nuRef"
    displayName: 'Publish to Local'

  - pwsh: |
      import-module ModuleForge -RequiredVersion $env:MODULEFORGE_VERSION
      if(get-command Get-MFBuildSummary -ErrorAction SilentlyContinue)
      {
        $summaryPath = join-path -path $env:AGENT_TEMPDIRECTORY -childPath 'buildSummary.md'
        (Get-MFBuildSummary -NugetPackagePath $env:NUGET_PACKAGE_PATH).Markdown|out-file -FilePath $summaryPath -encoding UTF8
        Write-Output "##vso[task.uploadsummary]$summaryPath"
      }else{
        write-warning 'This ModuleForge version has no Get-MFBuildSummary, so there is no build summary'
      }
    displayName: 'Build summary'
    env:
      NUGET_PACKAGE_PATH: $(nuget_Package_Path)

  - pwsh: |
        $verbosePreference = 'Continue'
        $nuRef = "$(nuget_Package_Path)"
        write-verbose "NugetPath: $nuRef"
        $versionTag = "$(next_version)"
        write-verbose "VerTag: $versionTag"
    displayName: 'Verifying Nuget Path Var and Version Tag Var'

  - pwsh: |
      $verbosePreference = 'Continue'
      $nextVersionTag = "v$(next_version)"
      write-verbose "NextVersionTag: $nextVersionTag"
      if($nextVersionTag)
      {
        write-verbose "Tagging Version as: $nextVersionTag"
        git tag "$nextVersionTag"
        #Checkout did not keep the token, so hand it to this push only, through env rather than the command line
        $env:GIT_CONFIG_COUNT = '1'
        $env:GIT_CONFIG_KEY_0 = 'http.extraheader'
        $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: bearer $($env:SYSTEM_ACCESSTOKEN)"
        git push origin "refs/tags/$nextVersionTag"
        if($LASTEXITCODE -ne 0){throw "Unable to push tag $nextVersionTag"}
      }else{
        throw 'Error, Next Version was not correctly passed through'
      }
    displayName: 'Apply Version Tag'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)


  - task: DotNetCoreCLI@2
    displayName: 'Push NuGet Package to Azure Artifacts'
    inputs:
      command: 'push'
      packagesToPush: '$(nuget_Package_Path)'
      nuGetFeedType: 'internal'
      publishVstsFeed: '$(publishFeed)' #Set by 'Find the Azure Artifacts feed'